name: DIAG nextweek source

# Temporaerer Diagnose-Workflow: klaert, wie ForexFactory (und Alternativen) auf
# Anfragen von einer GitHub-Runner-IP reagieren. Wird nach der Auswertung wieder
# geloescht. Committet nichts.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: A) FF calendar page, aktuelle Header
        run: |
          curl -s -o a.html -w "status=%{http_code} size=%{size_download} time=%{time_total}\n" --max-time 30 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml" \
            -H "Accept-Language: en-US,en;q=0.9" \
            "https://www.forexfactory.com/calendar?week=next" || true
          echo "--- marker: $(grep -c calendarComponentStates a.html || true)"
          echo "--- erste 400 Zeichen:"; head -c 400 a.html; echo

      - name: B) FF calendar page, vollstaendiger Browser-Header-Satz
        run: |
          curl -s -o b.html -w "status=%{http_code} size=%{size_download}\n" --max-time 30 \
            --compressed \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36' \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -H 'Accept-Encoding: gzip, deflate, br' \
            -H 'sec-ch-ua: "Not/A)Brand";v="8", "Chromium";v="126", "Google Chrome";v="126"' \
            -H 'sec-ch-ua-mobile: ?0' \
            -H 'sec-ch-ua-platform: "Windows"' \
            -H 'Sec-Fetch-Dest: document' \
            -H 'Sec-Fetch-Mode: navigate' \
            -H 'Sec-Fetch-Site: none' \
            -H 'Sec-Fetch-User: ?1' \
            -H 'Upgrade-Insecure-Requests: 1' \
            -H 'Cache-Control: max-age=0' \
            "https://www.forexfactory.com/calendar?week=next" || true
          echo "--- marker: $(grep -c calendarComponentStates b.html || true)"
          echo "--- erste 400 Zeichen:"; head -c 400 b.html; echo

      - name: C) FF, erst Startseite (Cookies holen), dann Kalender
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          curl -s -o /dev/null -c jar.txt --max-time 30 --compressed -H "User-Agent: $UA" "https://www.forexfactory.com/" || true
          echo "--- cookies:"; cat jar.txt | tail -5
          curl -s -o c.html -b jar.txt -c jar.txt -w "status=%{http_code} size=%{size_download}\n" --max-time 30 --compressed \
            -H "User-Agent: $UA" \
            -H 'Accept: text/html,application/xhtml+xml' \
            -H 'Referer: https://www.forexfactory.com/calendar' \
            "https://www.forexfactory.com/calendar?week=next" || true
          echo "--- marker: $(grep -c calendarComponentStates c.html || true)"
          head -c 400 c.html; echo

      - name: D) r.jina.ai Reader-Proxy (roh-HTML)
        run: |
          curl -s -o d.html -w "status=%{http_code} size=%{size_download}\n" --max-time 45 \
            -H 'x-respond-with: html' \
            "https://r.jina.ai/https://www.forexfactory.com/calendar?week=next" || true
          echo "--- marker: $(grep -c calendarComponentStates d.html || true)"
          head -c 400 d.html; echo

      - name: E) faireconomy Feed (Kontrolle, sollte gehen)
        run: |
          curl -s -o e.json -w "status=%{http_code} size=%{size_download}\n" --max-time 30 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            "https://nfs.faireconomy.media/ff_calendar_thisweek.json?_cb=$(date +%s)" || true
          node -e "try{const d=JSON.parse(require('fs').readFileSync('e.json','utf8'));console.log('feed ok, events:',d.length)}catch(e){console.log('feed kaputt:',e.message.slice(0,100))}"

      - name: F) Runner-Egress-IP
        run: curl -s --max-time 15 https://api.ipify.org; echo
