name: Update FF feed cache

on:
  schedule:
    # Alle 30 Min — gleiche Taktung wie AUTO_REFRESH_MS im Client. Häufiger zu
    # pollen bringt nichts, weil die App den Cache ohnehin nur alle 30 Min liest;
    # der FF-Feed selbst ändert sich real nur ein paar Mal am Tag.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Läufe nie parallel fahren: zwei gleichzeitige Jobs pushen sonst auf denselben
# Branch und einer stirbt im Push. cancel-in-progress bleibt aus, damit ein
# laufender Abruf nicht abgebrochen wird — der nächste wartet einfach.
concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Der Job braucht normal <1 Min. Ohne Limit würde ein hängender Abruf
    # bis zu 6 Stunden einen Runner blockieren und Folgeläufe stauen.
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 — der Retry unten rebased; auf einem flachen Klon
      # (Default: depth 1) schlägt das fehl. Das Repo ist klein genug dafür.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch ForexFactory calendar feed (laufende Woche)
        run: |
          # Zwei Fallstricke bei diesem Feed:
          # 1. Der Host rate-limitet Nicht-Browser-User-Agents (curl-Default bekommt eine
          #    "Rate Limited"-HTML-Seite, teils sogar mit HTTP 200 aus dem CDN-Cache) —
          #    deshalb ein Browser-UA + die JSON-Validierung unten.
          # 2. Die Validierung muss fs+JSON.parse nutzen: require() einer Datei ohne
          #    .json-Endung wird als JS-Modul geladen und exportiert {}, damit fiel die
          #    frühere Prüfung IMMER durch und der Snapshot blieb ewig stehen.
          ok=false
          for attempt in 1 2 3; do
            curl -sf \
              -H "User-Agent: $UA" \
              -H "Accept: application/json,text/plain,*/*" \
              "https://nfs.faireconomy.media/ff_calendar_thisweek.json?_cb=$(date +%s)-$attempt" \
              -o thisweek.json.new || true
            if [ -s thisweek.json.new ] && node -e "const d=JSON.parse(require('fs').readFileSync('thisweek.json.new','utf8')); process.exit(Array.isArray(d) && d.length ? 0 : 1)"; then
              mv thisweek.json.new thisweek.json
              ok=true
              break
            fi
            echo "Versuch $attempt: Feed ungültig/leer (evtl. Rate-Limit)"
            rm -f thisweek.json.new
            [ "$attempt" != "3" ] && sleep 15
          done
          if [ "$ok" != "true" ]; then
            echo "::warning::FF-JSON-Feed lieferte 3x kein gültiges JSON (vermutlich Rate-Limit) — laufende Woche kommt diesmal nur aus dem Bestand"
            rm -f thisweek.json
          fi
        env:
          UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

      - name: Fetch ForexFactory calendar page (Folgewoche)
        run: |
          # Der offizielle JSON-Feed kennt NUR die laufende Woche und springt erst
          # sonntags um — dadurch sah man die Folgewoche immer erst ab Sonntag.
          # Die Kalenderseite rendert /calendar?week=next und legt die Events als
          # window.calendarComponentStates in die Seite; das lesen wir aus.
          #
          # ForexFactory beantwortet Anfragen von GitHub-Runner-IPs (Azure) allerdings
          # mit 403 — gemessen, und zwar unabhaengig von Headern: voller Browser-Header-
          # Satz und vorher geholte Startseiten-Cookies aendern nichts. Es ist ein
          # IP-Block, kein UA-Filter. Vom heimischen Anschluss aus geht derselbe Abruf.
          # Deshalb zusaetzlich der Reader-Proxy r.jina.ai, der die Seite von seinen
          # eigenen IPs holt und das rohe HTML zurueckgibt (x-respond-with: html).
          # Direkt wird trotzdem zuerst probiert: kostet nur ~0,1s bis zum 403 und
          # zieht automatisch wieder, falls FF den Block irgendwann aufhebt.
          #
          # Schlaegt beides fehl, ist das NICHT fatal: der Build faellt auf Feed +
          # Bestand zurueck, also aufs alte Ein-Wochen-Verhalten.
          FF_URL="https://www.forexfactory.com/calendar?week=next"
          ok=false
          for attempt in 1 2 3; do
            for route in direkt proxy; do
              if [ "$route" = "direkt" ]; then
                curl -sf --max-time 30 \
                  -H "User-Agent: $UA" \
                  -H "Accept: text/html,application/xhtml+xml" \
                  -H "Accept-Language: en-US,en;q=0.9" \
                  "$FF_URL" -o nextweek.html.new || true
              else
                curl -sf --max-time 45 \
                  -H "x-respond-with: html" \
                  "https://r.jina.ai/$FF_URL" -o nextweek.html.new || true
              fi
              if [ -s nextweek.html.new ] && grep -q "calendarComponentStates" nextweek.html.new; then
                mv nextweek.html.new nextweek.html
                echo "Folgewoche geladen ($route)"
                ok=true
                break 2
              fi
              echo "Versuch $attempt/$route: keine verwertbaren Daten"
              rm -f nextweek.html.new
            done
            [ "$attempt" != "3" ] && sleep 10
          done
          if [ "$ok" != "true" ]; then
            echo "::warning::Folgewoche nicht abrufbar (weder direkt noch ueber Proxy) — Horizont kommt diesmal nur aus Feed + Bestand"
            rm -f nextweek.html
          fi
        env:
          UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

      - name: Build merged cache
        run: |
          node .github/scripts/build-feed-cache.js \
            "$([ -f thisweek.json ] && echo thisweek.json || echo -)" \
            "$([ -f nextweek.html ] && echo nextweek.html || echo -)" \
            "$([ -f feed-cache.json ] && echo feed-cache.json || echo -)" \
            feed-cache.json
          rm -f thisweek.json nextweek.html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed-cache.json
          git diff --cached --quiet && exit 0
          git commit -m "Update FF feed cache"
          # Zwischenzeitlich gepushte Commits (z.B. eigene Änderungen an index.html)
          # einholen statt am Push zu scheitern; --rebase hält die Historie linear.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin master || true
          done
          echo "::error::Push nach 3 Versuchen fehlgeschlagen"
          exit 1
