name: Update FF feed cache

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ForexFactory calendar feed
        run: |
          curl -sf "https://nfs.faireconomy.media/ff_calendar_thisweek.json" -o feed-cache.json.new
          # Nur übernehmen wenn gültiges, nicht-leeres JSON-Array — sonst alten Snapshot behalten
          if [ -s feed-cache.json.new ] && node -e "const d=require('./feed-cache.json.new'); process.exit(Array.isArray(d) && d.length ? 0 : 1)"; then
            mv feed-cache.json.new feed-cache.json
          else
            echo "Feed ungültig/leer — behalte vorherigen Snapshot"
            rm -f feed-cache.json.new
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed-cache.json
          git diff --cached --quiet || git commit -m "Update FF feed cache"
          git push
